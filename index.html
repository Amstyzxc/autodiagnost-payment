<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Оплата подписки — Автодиагност</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://widget.cloudpayments.ru/bundles/cloudpayments"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .subtitle {
            color: var(--tg-theme-hint-color, #707579);
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .price-block {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .price {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .period {
            color: var(--tg-theme-hint-color, #707579);
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 12px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary {
            background: #1a8a3a;
        }
        .status {
            margin-top: 8px;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #707579);
            min-height: 20px;
        }
        .status.error { color: #d92f2f; }
        .status.success { color: #1a8a3a; }
        .features {
            text-align: left;
            margin: 16px 0 24px 0;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #707579);
            line-height: 1.6;
        }
        .features li { list-style: none; padding-left: 20px; position: relative; }
        .features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #1a8a3a;
            font-weight: 700;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🔧</div>
    <h1>Подписка на Автодиагност</h1>
    <p class="subtitle">Доступ к ИИ-консультанту по диагностике авто</p>

    <div class="price-block">
        <div class="price" id="priceLabel">300 ₽</div>
        <div class="period">за 30 дней</div>
    </div>

    <ul class="features">
        <li>Безлимитные вопросы по авто</li>
        <li>Расшифровка OBD-II кодов</li>
        <li>Распознавание голосовых сообщений</li>
        <li>История диалогов сохраняется</li>
    </ul>

    <button type="button" id="payBtn">Оплатить 300 ₽</button>
    <button type="button" id="confirmBtn" class="secondary hidden">✅ Я оплатил, активировать подписку</button>
    <div class="status" id="status"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const PUBLIC_ID = "pk_c9ca1dd01909d25c5f36b6273f0d3";
    const params = new URLSearchParams(window.location.search);
    const tgId = params.get("tg_id") || (tg.initDataUnsafe?.user?.id ?? "");
    const AMOUNT = parseInt(params.get("amount") || "300", 10);

    document.getElementById("priceLabel").textContent = AMOUNT + " ₽";
    const payBtn = document.getElementById("payBtn");
    const confirmBtn = document.getElementById("confirmBtn");
    payBtn.textContent = "Оплатить " + AMOUNT + " ₽";
    const statusEl = document.getElementById("status");

    let lastInvoiceId = null;
    let lastTransactionId = null;
    let alreadySent = false;

    function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function sendSuccess() {
        if (alreadySent) return;
        alreadySent = true;
        tg.sendData(JSON.stringify({
            type: "payment_success",
            telegram_id: String(tgId),
            transaction_id: lastTransactionId,
            invoice_id: lastInvoiceId
        }));
        setStatus("Активируем подписку...", "success");
        setTimeout(() => tg.close(), 1500);
    }

    confirmBtn.addEventListener("click", sendSuccess);

    payBtn.addEventListener("click", () => {
        if (!tgId) {
            setStatus("Не удалось получить Telegram ID. Откройте оплату из бота.", "error");
            return;
        }
        payBtn.disabled = true;
        setStatus("Открываем форму оплаты...");

        const invoiceId = "sub_" + tgId + "_" + Date.now();
        lastInvoiceId = invoiceId;

        const widget = new cp.CloudPayments();
        widget.pay("charge", {
            publicId: PUBLIC_ID,
            description: "Подписка на Автодиагност (1 месяц)",
            amount: AMOUNT,
            currency: "RUB",
            invoiceId: invoiceId,
            accountId: String(tgId),
            data: { telegram_id: String(tgId) }
        }, {
            onSuccess: function (options) {
                lastTransactionId = options?.transactionId || null;
                sendSuccess();
            },
            onFail: function (reason, options) {
                payBtn.disabled = false;
                setStatus("Оплата не прошла: " + (reason || "неизвестная ошибка"), "error");
                confirmBtn.classList.add("hidden");
            },
            onComplete: function (paymentResult, options) {
                if (paymentResult && paymentResult.success) {
                    lastTransactionId =
                        options?.transactionId ||
                        paymentResult?.transactionId ||
                        lastTransactionId;
                    sendSuccess();
                    return;
                }
                if (!alreadySent) {
                    payBtn.classList.add("hidden");
                    confirmBtn.classList.remove("hidden");
                    setStatus(
                        "Если оплата прошла, нажмите кнопку ниже для активации.",
                    );
                }
            }
        });
    });
</script>
</body>
</html>
